<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Compensation Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            max-width: 900px; 
            margin: auto; 
            color: #333;
        }
        h2 { text-align: center; }
        .role-selector {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .role-selector label {
            margin: 0 15px;
            cursor: pointer;
        }
        .slider-container { margin: 20px 0 30px; text-align: center; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .revenue-label { font-size: 24px; font-weight: bold; margin-top: 10px; }
        .metrics-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            margin-bottom: 30px; 
        }
        .metric-card { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 8px; 
            text-align: center; 
            border: 1px solid #dee2e6;
        }
        .metric-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #6c757d; text-transform: uppercase; }
        .metric-card p { margin: 0; font-size: 22px; font-weight: bold; }
        .highlight { color: #0d6efd; }
    </style>
</head>
<body>

    <h2>Sales Compensation Model</h2>
    
    <div class="role-selector">
        <label>
            <input type="radio" name="role" value="AAE" checked> AAE Role
        </label>
        <label>
            <input type="radio" name="role" value="AE"> AE Role
        </label>
    </div>

    <div class="slider-container">
        <label for="revenueSlider">Move slider to adjust Annual Billed Revenue</label>
        <input type="range" id="revenueSlider" min="0" max="900000" step="5000" value="300000">
        <div class="revenue-label">Annual Billed Revenue: $<span id="revenueDisplay">300,000</span></div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <h3>Base Salary</h3>
            <p id="baseDisplay">$50,000</p>
        </div>
        <div class="metric-card">
            <h3 id="commLabel">Commission (10%)</h3>
            <p id="commDisplay">$30,000</p>
        </div>
        <div class="metric-card">
            <h3>Annual Bonus</h3>
            <p id="bonusDisplay">$28,000</p>
        </div>
        <div class="metric-card">
            <h3>Total Compensation</h3>
            <p id="totalDisplay" class="highlight">$108,000</p>
        </div>
        <div class="metric-card">
            <h3>Total Cost of Sale</h3>
            <p id="tcosDisplay">36.0%</p>
        </div>
        <div class="metric-card">
            <h3>Commission % of Sale</h3>
            <p id="varcosDisplay">19.3%</p>
        </div>
    </div>

    <canvas id="compChart"></canvas>

    <script>
        const roles = {
            AAE: {
                base: 50000,
                commissionRate: 0.10,
                commissionLabel: 'Commission (10%)',
                maxRevenue: 900000,
                getBonus: function(revenue) {
                    if (revenue < 150000) return 0;       // < 50%
                    if (revenue < 225000) return 8000;    // 50-74%
                    if (revenue < 300000) return 16000;   // 75-99%
                    if (revenue < 318000) return 28000;   // 100-105%
                    if (revenue < 348000) return 32000;   // 106-115%
                    if (revenue < 378000) return 37000;   // 116-125%
                    if (revenue < 450000) return 44000;   // 126-149%
                    if (revenue < 525000) return 54000;   // 150-174%
                    if (revenue < 600000) return 66000;   // 175-199%
                    return 80000;                         // 200%+
                }
            },
            AE: {
                base: 70000,
                commissionRate: 0.08,
                commissionLabel: 'Commission (8%)',
                maxRevenue: 1200000,
                getBonus: function(revenue) {
                    if (revenue < 225000) return 0;       // < 50%
                    if (revenue < 337500) return 10000;   // 50-74%
                    if (revenue < 450000) return 22000;   // 75-99%
                    if (revenue < 477000) return 34000;   // 100-105%
                    if (revenue < 522000) return 38000;   // 106-115%
                    if (revenue < 567000) return 44000;   // 116-125%
                    if (revenue < 675000) return 54000;   // 126-149%
                    if (revenue < 787500) return 68000;   // 150-174%
                    if (revenue < 900000) return 82000;   // 175-199%
                    return 98000;                         // 200%+
                }
            }
        };

        let currentRole = 'AAE';

        const ctx = document.getElementById('compChart').getContext('2d');
        let compChart;

        const slider = document.getElementById('revenueSlider');
        const revDisp = document.getElementById('revenueDisplay');
        const baseDisp = document.getElementById('baseDisplay');
        const commLabel = document.getElementById('commLabel');
        const commDisp = document.getElementById('commDisplay');
        const bonusDisp = document.getElementById('bonusDisplay');
        const totalDisp = document.getElementById('totalDisplay');
        const tcosDisp = document.getElementById('tcosDisplay');
        const varcosDisp = document.getElementById('varcosDisplay');
        const roleRadios = document.querySelectorAll('input[name="role"]');

        function generateChartData() {
            const role = roles[currentRole];
            const revPoints = [];
            const basePoints = [];
            const commPoints = [];
            const bonusPoints = [];

            for (let r = 0; r <= role.maxRevenue; r += 5000) {
                revPoints.push(r);
                basePoints.push(role.base);
                commPoints.push(r * role.commissionRate);
                bonusPoints.push(role.getBonus(r));
            }

            return {
                labels: revPoints,
                datasets: [
                    {
                        label: 'Base Salary',
                        data: basePoints,
                        borderColor: '#6c757d',
                        backgroundColor: 'rgba(108, 117, 125, 0.2)',
                        fill: true,
                        pointRadius: 0
                    },
                    {
                        label: 'Commission',
                        data: commPoints,
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13, 110, 253, 0.2)',
                        fill: true,
                        pointRadius: 0
                    },
                    {
                        label: 'Bonus',
                        data: bonusPoints,
                        borderColor: '#198754',
                        backgroundColor: 'rgba(25, 135, 84, 0.2)',
                        fill: true,
                        pointRadius: 0
                    }
                ]
            };
        }

        function initChart() {
            compChart = new Chart(ctx, {
                type: 'line',
                data: generateChartData(),
                options: {
                    responsive: true,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Billed Revenue ($)' },
                            ticks: {
                                callback: function(value, index) {
                                    const labels = compChart.data.labels;
                                    return '$' + (labels[index] / 1000) + 'k';
                                }
                            }
                        },
                        y: {
                            stacked: true,
                            title: { display: true, text: 'Total Earnings ($)' }
                        }
                    }
                }
            });
        }

        function updateChart() {
            compChart.data = generateChartData();
            compChart.update();
        }

        function updateUI() {
            const role = roles[currentRole];
            const rev = parseInt(slider.value);
            const base = role.base;
            const comm = rev * role.commissionRate;
            const bonus = role.getBonus(rev);
            const total = base + comm + bonus;
            
            const tcos = rev > 0 ? ((total / rev) * 100).toFixed(1) : 0;
            const varcos = rev > 0 ? (((comm + bonus) / rev) * 100).toFixed(1) : 0;

            commLabel.innerText = role.commissionLabel;
            revDisp.innerText = rev.toLocaleString();
            baseDisp.innerText = '$' + base.toLocaleString();
            commDisp.innerText = '$' + comm.toLocaleString();
            bonusDisp.innerText = '$' + bonus.toLocaleString();
            totalDisp.innerText = '$' + total.toLocaleString();
            tcosDisp.innerText = tcos + '%';
            varcosDisp.innerText = varcos + '%';
        }

        slider.addEventListener('input', updateUI);

        roleRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentRole = e.target.value;
                slider.max = roles[currentRole].maxRevenue;
                
                if (parseInt(slider.value) > slider.max) {
                    slider.value = slider.max;
                }
                
                updateUI();
                updateChart();
            });
        });

        initChart();
        updateUI();
    </script>
</body>
</html>
